<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- original blue & white tile, inspired by Tunisian ceramics. Tiles seamlessly. -->
  <rect width="120" height="120" fill="#22409a"/>
  <g fill="none" stroke="#f4f1ea" stroke-width="2">
    <!-- frame lines that join neighbouring tiles -->
    <path d="M0 60H22M98 60H120M60 0V22M60 98V120"/>
    <!-- corner quarter-rosettes (become full rosettes when tiled) -->
    <circle cx="0" cy="0" r="18"/><circle cx="120" cy="0" r="18"/>
    <circle cx="0" cy="120" r="18"/><circle cx="120" cy="120" r="18"/>
  </g>
  <!-- corner flowers -->
  <g fill="#f4f1ea">
    <g id="cf">
      <circle cx="0" cy="0" r="5"/>
      <ellipse cx="11" cy="0" rx="4.5" ry="2.4"/><ellipse cx="0" cy="11" rx="2.4" ry="4.5"/>
      <ellipse cx="7.8" cy="7.8" rx="4" ry="2.2" transform="rotate(45 7.8 7.8)"/>
    </g>
    <use href="#cf" transform="translate(120 0) scale(-1 1)"/>
    <use href="#cf" transform="translate(0 120) scale(1 -1)"/>
    <use href="#cf" transform="translate(120 120) scale(-1 -1)"/>
  </g>
  <!-- central eight-point star -->
  <g transform="translate(60 60)">
    <rect x="-27" y="-27" width="54" height="54" fill="#f4f1ea"/>
    <rect x="-27" y="-27" width="54" height="54" fill="#f4f1ea" transform="rotate(45)"/>
    <rect x="-22" y="-22" width="44" height="44" fill="#22409a"/>
    <rect x="-22" y="-22" width="44" height="44" fill="#22409a" transform="rotate(45)"/>
    <!-- inner flower -->
    <g fill="#f4f1ea">
      <ellipse cx="0" cy="-12" rx="4.5" ry="9"/>
      <ellipse cx="0" cy="-12" rx="4.5" ry="9" transform="rotate(45)"/>
      <ellipse cx="0" cy="-12" rx="4.5" ry="9" transform="rotate(90)"/>
      <ellipse cx="0" cy="-12" rx="4.5" ry="9" transform="rotate(135)"/>
      <ellipse cx="0" cy="-12" rx="4.5" ry="9" transform="rotate(180)"/>
      <ellipse cx="0" cy="-12" rx="4.5" ry="9" transform="rotate(225)"/>
      <ellipse cx="0" cy="-12" rx="4.5" ry="9" transform="rotate(270)"/>
      <ellipse cx="0" cy="-12" rx="4.5" ry="9" transform="rotate(315)"/>
    </g>
    <circle r="5.5" fill="#22409a"/>
    <circle r="2.5" fill="#f4f1ea"/>
  </g>
  <!-- small diamonds on the mid-edges -->
  <g fill="#f4f1ea">
    <path d="M60 -6l6 6-6 6-6-6z"/><path d="M60 114l6 6-6 6-6-6z"/>
    <path d="M-6 60l6-6 6 6-6 6z"/><path d="M114 60l6-6 6 6-6 6z"/>
  </g>
</svg>
